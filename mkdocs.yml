hooks:
  - hooks/discovery.py
  - hooks/external_links.py

extra_css:
  - stylesheets/extra.css
  - stylesheets/widgets.css
  - stylesheets/pdf-preview.css
  - stylesheets/watchlist.css
  - stylesheets/about.css
  - stylesheets/discovery.css
  - stylesheets/changelog.css

extra_javascript:
  - javascripts/site-links.js
  - javascripts/visit-session.js
  - javascripts/site-stats.js
  - javascripts/site.js
  - javascripts/music-rhythm.js
  - javascripts/music-shuffle.js
  - javascripts/widgets.js
  - javascripts/pdf-preview.js
  - javascripts/watchlist.js
  - javascripts/about.js
  - javascripts/discovery.js
  - javascripts/mathjax.js
  - javascripts/vendor/mathjax/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: zh

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: false
  - pymdownx.tilde
  - pymdownx.caret
  - tables

extra:
  generator: false
