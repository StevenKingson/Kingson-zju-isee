site_name: KING桑の放课后茶会
site_url: !ENV [SITE_URL, 'http://127.0.0.1:8000/']
site_description: 记录课程笔记与日常，欢迎来到 KING桑的放课后茶会。

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  palette:
    scheme: default
    primary: white
    accent: indigo
  features:
    - navigation.instant
    - navigation.tabs

exclude_docs: |
  course/year2/major-required/isee-introduction/reports/experiment-*/source/report.md
  course/year2/major-required/isee-introduction/resources/report-template/template.md

nav:
- 主页: index.md
- 课程:
