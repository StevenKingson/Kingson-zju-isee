name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install MkDocs and Material
        run: python -m pip install -r requirements.txt
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Refresh gallery, music and anime catalogues
        run: |
          python scripts/update-gallery.py
          python scripts/update-music.py
          python scripts/update-watchlist.py
      - name: Build website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: python -m mkdocs build --strict
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
